name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner já traz o Android SDK; só garante licenças e componentes (falhas aqui não param o build)
      - name: Preparar SDK/NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mobile3d-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # Compila o motor no Linux e renderiza as cenas com Mesa (GLES 3.2 por software):
  # valida shaders, física, gizmo, seleção e carregamento de glTF sem precisar do celular.
  teste-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependências (Mesa EGL/GLES)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl-dev libgles-dev libegl-mesa0 mesa-utils > /dev/null

      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4 --target mobile3d_headless

      - name: Baixar modelos de teste (Khronos)
        run: |
          mkdir -p models
          base=https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models
          curl -sSfL -o models/Fox.glb $base/Fox/glTF-Binary/Fox.glb || true
          curl -sSfL -o models/DamagedHelmet.glb $base/DamagedHelmet/glTF-Binary/DamagedHelmet.glb || true
          three=https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models
          curl -sSfL -o models/Soldier.glb $three/gltf/Soldier.glb || true
          curl -sSfL -o models/Xbot.glb $three/gltf/Xbot.glb || true
          curl -sSfL -o models/Samba_Dancing.fbx "$three/fbx/Samba%20Dancing.fbx" || true

      - name: Rodar teste headless
        run: |
          mkdir -p screenshots
          ./build/mobile3d_headless shaders screenshots models/*.glb models/*.fbx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-teste
          path: screenshots/*.png
