plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mobile3d'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.mobile3d.engine'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++20'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Os shaders GLSL da pasta ../shaders viram assets do APK (copiados para o storage no 1º uso)
    sourceSets {
        main { assets.srcDirs = ['src/main/assets', '../shaders'] }
    }
    // sem compressão no APK: a cópia na 1ª abertura fica mais rápida e dá para ver o tamanho sem ler o arquivo
    androidResources {
        noCompress 'glb', 'gltf', 'bin', 'wav', 'anim', 'ttf', 'fbx', 'jpg', 'png'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // arquivos repetidos entre as bibliotecas do SDK (Jackson, OkHttp...) que não vão para o APK
    packaging {
        resources {
            excludes += ['META-INF/versions/9/module-info.class', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                         'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.md']
        }
    }
}

dependencies {
    // Assistente de IA (Claude): SDK oficial da Anthropic para Java/Kotlin
    implementation 'com.anthropic:anthropic-java:3.2.0'
}
